[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taisan-bhyt-copilot"
version = "1.0.0"
description = "BHYT Clinical Copilot & Xuất Toán Validation Engine for Tai Sanh Clinic"
readme = "README.md"
authors = [{ name = "William Bien", email = "admin@phongkhamtaisanh.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
]

[project.scripts]
bhyt-cli = "data_engine.cli:main"
bhyt-sync = "scripts.auto_update_cron:main"
